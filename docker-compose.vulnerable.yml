# VULNERABLE: finance-agent and slack-agent share one named volume at /secrets.
# This models "separate agents sharing one cloud compute instance" from the
# reported incident -- two agents, two jobs, one filesystem.
services:
  mock-slack:
    image: python:3.12-slim
    volumes:
      - ./mock_slack:/app
    command: ["python", "/app/server.py"]

  finance-agent:
    image: python:3.12-slim
    volumes:
      - ./agents:/app
      - shared-secrets:/secrets
    environment:
      - SECRET_PATH=/secrets/finance.json
    command: ["python", "/app/finance_agent.py"]

  slack-agent:
    image: python:3.12-slim
    volumes:
      - ./agents:/app
      - shared-secrets:/secrets
    environment:
      - SECRET_PATH=/secrets/finance.json
      - SLACK_WEBHOOK=http://mock-slack:8080/post
    command: ["python", "/app/slack_agent.py"]
    depends_on:
      - mock-slack
      - finance-agent

volumes:
  shared-secrets:
